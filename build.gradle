// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

version = '0.2.0'
group = 'com.prismora'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'prismora.performanceSmoke', providers.gradleProperty('prismoraPerformanceSmoke').getOrElse('false')
            systemProperty 'prismora.smoke', providers.gradleProperty('prismoraSmoke').getOrElse('false')
            systemProperty 'prismora.uiSmoke', providers.gradleProperty('prismoraUiSmoke').getOrElse('false')
            systemProperty 'prismora.renderSmoke', providers.gradleProperty('prismoraRenderSmoke').getOrElse('false')
            systemProperty 'prismora.expectedStartup', providers.gradleProperty('prismoraExpectedStartup').getOrElse('')
            systemProperty 'prismora.geometryProbe', providers.gradleProperty('prismoraGeometryProbe').getOrElse('false')
            systemProperty 'prismora.smokePack', providers.gradleProperty('prismoraSmokePack').getOrElse('Prismora-Diagnostic')
            systemProperty 'forge.enabledGameTestNamespaces', 'prismora'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'prismora', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.0')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }


tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    from('LICENSE.md')
    from('docs/third-party/Forge-MDK-LICENSE.txt') { into 'META-INF/licenses' }
    manifest { attributes 'Implementation-Version': project.version }
}

tasks.register('inspectShaderPack', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.prismora.compat.PackInspector'
    args providers.gradleProperty('shaderPack').getOrElse('shaderpacks/missing.zip')
}
