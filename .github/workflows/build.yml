name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build and run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\gradlew.bat --no-daemon build --console=plain
      - name: Build and run unit tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash gradlew --no-daemon build --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: build/reports/tests/test
          if-no-files-found: ignore
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: prismora-jar-${{ runner.os }}
          path: build/libs/*.jar
